<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antigravity Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-toggle-files" class="icon-btn" title="Files">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
        </button>
        <div class="brand">
          <span class="logo-gemini">✦</span>
          <span class="logo-text">Antigravity</span>
          <span class="badge-mobile">MOBILE</span>
        </div>
      </div>
      <div class="header-right">
        <div id="status-pill" class="status-indicator">
          <span class="status-dot"></span>
          <span id="model-label">3.8 Flash</span>
        </div>
        <button id="btn-settings" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Side File Drawer -->
    <div id="file-drawer" class="file-drawer">
      <div class="drawer-header">
        <h3>Workspace Explorer</h3>
        <button id="btn-close-drawer" class="icon-btn">&times;</button>
      </div>
      <div id="file-list" class="file-list">
        <p class="empty-state">Loading workspace files...</p>
      </div>
    </div>
    <div id="drawer-overlay" class="drawer-overlay"></div>

    <!-- Main Chat Feed -->
    <main id="chat-messages" class="chat-feed">
      <div class="welcome-card">
        <div class="welcome-icon">✦</div>
        <h2>Antigravity Mobile</h2>
        <p>Your agentic AI software companion on Android. Build, run commands, edit code, and sync to GitHub anywhere.</p>
        <div class="quick-chips">
          <button class="chip" onclick="sendQuickPrompt('Check device status and workspace')">📱 Device Status</button>
          <button class="chip" onclick="sendQuickPrompt('List files in the workspace and git status')">📂 Git Status</button>
          <button class="chip" onclick="sendQuickPrompt('Create a simple demo web app with HTML, CSS, and JS')">🚀 Create Web App</button>
        </div>
      </div>
    </main>

    <!-- Floating Activity / Status Pill -->
    <div id="live-activity-pill" class="activity-pill hidden">
      <span class="spinner"></span>
      <span id="activity-text">Thinking...</span>
    </div>

    <!-- Bottom Input Bar -->
    <footer class="app-input-bar">
      <div class="input-container">
        <button id="btn-voice" class="icon-btn voice-btn" title="Voice Input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <textarea id="prompt-input" rows="1" placeholder="Ask Antigravity to code, build, test..."></textarea>
        <button id="btn-send" class="send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Settings</h3>
          <button id="btn-close-settings" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <label>Gemini API Key</label>
          <input type="password" id="input-api-key" placeholder="AIzaSy...">
          <small>Get a free key from Google AI Studio (aistudio.google.com)</small>

          <label>Model</label>
          <select id="select-model">
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Recommended, 2s)</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.8-flash">Gemini 3.8 Flash (Thinking)</option>
          </select>

          <label>Workspace Path</label>
          <input type="text" id="input-workspace" placeholder="/data/data/com.termux/files/home/workspace">
          
          <button id="btn-save-settings" class="primary-btn">Save Settings</button>
        </div>
      </div>
    </div>

    <!-- Code Viewer Modal -->
    <div id="file-viewer-modal" class="modal hidden">
      <div class="modal-content file-viewer-content">
        <div class="modal-header">
          <h3 id="viewer-filename">File</h3>
          <button id="btn-close-viewer" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <pre id="viewer-code"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
