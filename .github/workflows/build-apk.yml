name: Build PocketDev Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Accept Android SDK Licenses & Prepare Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || true

      - name: Extract Diagnostics & Check APK
        run: |
          echo "=== FULL BUILD LOG ==="
          cat build.log
          echo "======================"
          
          # Scan build.log for errors and output as GitHub Action annotations
          python3 -c "
          with open('build.log') as f:
              for line in f:
                  l = line.strip()
                  if any(k in l for k in ['FAILED', 'FAILURE', 'error:', 'Caused by:', 'AAPT:']):
                      print(f'::error::{l}')
          " || true

          APK_PATH=$(find android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle assembleDebug did not produce any APK."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p apk_output
          cp "$APK_PATH" apk_output/PocketDev.apk
          cp "$APK_PATH" apk_output/AntigravityMobile.apk

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketDev-APK
          path: apk_output/PocketDev.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            apk_output/PocketDev.apk
            apk_output/AntigravityMobile.apk
          tag_name: v1.0.0
          name: "PocketDev Mobile v1.0.0"
          body: "Direct native APK install for PocketDev Mobile on Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
